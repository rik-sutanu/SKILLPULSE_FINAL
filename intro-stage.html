<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPulse Full-Screen Intro Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #180506;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .replay-control-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000000;
      display: flex;
      gap: 1rem;
    }
    .replay-btn {
      background: rgba(201, 162, 39, 0.9);
      color: #2E0D0E;
      font-weight: 700;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.875rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .replay-btn:hover {
      background: #D6B94D;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Full-Screen Stage (No box) -->
  <div class="skillpulse-intro-stage" id="introStage" role="img" aria-label="SkillPulse Brand Intro Animation">
    <div class="intro-stage-bg" aria-hidden="true"></div>

    <!-- Phase 1: Scattered Gold Dots Across Full Screen -->
    <div class="intro-dots-layer" aria-hidden="true">
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
      <span class="intro-dot"></span>
    </div>

    <!-- Phase 2: Bars Growing in Center -->
    <div class="intro-bars-layer" aria-hidden="true">
      <div class="intro-bar"></div>
      <div class="intro-bar"></div>
      <div class="intro-bar"></div>
      <div class="intro-bar"></div>
      <div class="intro-bar"></div>
      <div class="intro-bar"></div>
      <div class="intro-bar"></div>
    </div>

    <!-- Phase 3: Logo Reveal directly above SkillPulse wordmark -->
    <div class="intro-phase3">
      <!-- 76x76 rounded square logo mark (border-radius 20px) -->
      <div class="intro-logo-tile">
        <!-- 46x46 inline SVG containing gold (#E8CB6C) ECG/pulse polyline, stroke-width 3.4 -->
        <svg width="46" height="46" viewBox="0 0 46 46" fill="none" class="intro-pulse-svg" aria-hidden="true">
          <path d="M4 25 H14 L18.5 13 L24.5 33 L29 25 H42" 
                fill="none" 
                stroke="#E8CB6C" 
                stroke-width="3.4" 
                stroke-linecap="round" 
                stroke-linejoin="round" 
                class="intro-pulse-path" />
        </svg>
      </div>

      <!-- SkillPulse Wordmark -->
      <h1 class="intro-wordmark">Skill<span class="pulse-accent">Pulse</span></h1>

      <!-- Tagline -->
      <p class="intro-tagline">Where Real Industry Demand Meets Skill Development</p>
    </div>
  </div>

  <div class="replay-control-bar">
    <button class="replay-btn" onclick="replayAnimation()">&#8635; Replay Intro</button>
    <a href="index.php" class="replay-btn" style="background:rgba(250,246,238,0.18);color:#FAF6EE;">Enter Website &rarr;</a>
  </div>

  <script>
    function replayAnimation() {
      const stage = document.getElementById('introStage');
      const clone = stage.cloneNode(true);
      stage.parentNode.replaceChild(clone, stage);
    }
  </script>
</body>
</html>
